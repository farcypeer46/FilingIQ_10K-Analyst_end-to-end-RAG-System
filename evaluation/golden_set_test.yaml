    ground_truth: "Both disclose significant China-related risks, but of different kinds. Apple's is operational and market-based: a majority of its manufacturing is concentrated with outsourcing partners in China mainland (and other Asian countries) and Greater China is a major sales market, so tariffs, trade restrictions, and U.S.-China tensions threaten its supply chain and demand. NVIDIA's is primarily regulatory/export-control: U.S. government licensing requirements (2022-2025, including the 'AI Diffusion' rule) restrict sales of its advanced GPUs (A100/H100/H800/Blackwell, etc.) to China, and NVIDIA states it has not received licenses to ship restricted products there, harming its competitive position and potentially excluding it from the China market; its supply chain is also concentrated in the Asia-Pacific region."
