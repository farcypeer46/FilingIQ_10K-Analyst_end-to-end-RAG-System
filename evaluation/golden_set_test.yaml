  - question: "What are Apple's main product and service categories?"
    ground_truth: "Products: iPhone; Mac; iPad; and Wearables, Home and Accessories (Apple Watch, AirPods, Beats, Apple Vision Pro, Apple TV, HomePod). Services: Advertising; AppleCare; Cloud Services; Digital Content (App Store, Apple Arcade, Apple Music, Apple TV+, Apple News+, Apple Fitness+); and Payment Services (Apple Card, Apple Pay)."
    company: AAPL
    type: factual
    expected_route: TEXT
    relevant: "AAPL FY2024 business"

  - question: "What does Apple identify as risks related to its dependence on third-party manufacturing and suppliers?"
    ground_truth: "Apple depends on outsourcing partners located primarily in China mainland, India, Japan, South Korea, Taiwan and Vietnam for component manufacturing and final assembly of substantially all its hardware, with a significant concentration performed by a small number of partners, often in single locations. Outsourcing reduces Apple's direct control over production and distribution, which can adversely affect the cost, quality, quantity, or timeliness of products. It relies on single-source partners for many components; risks include partner failures or disruptions (natural disasters, IT failures, disputes, geopolitical tensions), supplier code-of-conduct violations, and warranty/product-defect liabilities for which Apple remains responsible to the consumer."
    company: AAPL
    type: factual
    expected_route: TEXT
    relevant: "AAPL FY2024 risk_factors"

  - question: "How does Microsoft describe its three business segments?"
    ground_truth: "Microsoft reports in three segments: (1) Productivity and Business Processes — Microsoft 365 Commercial and Consumer (Office, Microsoft 365 Copilot, Teams, Exchange, SharePoint), LinkedIn, and Dynamics 365; (2) Intelligent Cloud — server products and cloud services including Azure and other cloud services, plus Enterprise and partner services; and (3) More Personal Computing — Windows and Devices (Windows OEM, Surface), Gaming (Xbox hardware, content and services, Game Pass), and Search and news advertising (Bing, Copilot, Edge)."
    company: MSFT
    type: factual
    expected_route: TEXT
    relevant: "MSFT FY2025 business"

  - question: "What risks does Microsoft cite related to cybersecurity?"
    ground_truth: "Microsoft warns that cyberattacks and security vulnerabilities could reduce revenue, increase costs, create liability, and harm its reputation or competitive position. Threats come from sophisticated actors including nation-states, state-sponsored groups, and cybercriminals using malware, exploitation of known/zero-day vulnerabilities, and social engineering; Microsoft discloses it has experienced incidents, including a nation-state password-spray attack beginning late November 2023 that accessed corporate email and some source-code repositories. It also cites risks to the security of its products, services, and customers' data (including unpatched/end-of-life systems), disclosure or misuse of personal data, supply-chain compromise, and new attack surfaces created by generative AI."
    company: MSFT
    type: factual
    expected_route: TEXT
    relevant: "MSFT FY2025 risk_factors"

  - question: "What does NVIDIA say about its dependence on TSMC and third-party foundries?"
    ground_truth: "NVIDIA uses a fabless manufacturing model, partnering with suppliers for wafer fabrication, assembly, testing, and packaging. It relies on foundries — Taiwan Semiconductor Manufacturing Company (TSMC) and Samsung — to produce its semiconductor wafers, uses CoWoS technology for packaging, purchases memory from SK Hynix, Micron, and Samsung, and engages contract manufacturers such as Hon Hai (Foxconn), Wistron, and Fabrinet for assembly, testing, and packaging. Its supply chain is mainly concentrated in the Asia-Pacific region, and in periods of growth it may place non-cancellable orders, pay premiums, or provide deposits to secure supply and capacity."
    company: NVDA
    type: factual
    expected_route: TEXT
    relevant: "NVDA FY2025 business"

  - question: "What are NVIDIA's reportable segments?"
    ground_truth: "NVIDIA reports its business in two segments: Compute & Networking (Data Center accelerated-computing platforms and AI solutions/software; networking such as Quantum InfiniBand and Spectrum Ethernet; NVIDIA DRIVE automotive/autonomous and EV solutions; Jetson robotics and embedded platforms; and DGX Cloud software and services) and Graphics (GeForce GPUs for gaming and PCs; GeForce NOW cloud gaming; Quadro/NVIDIA RTX enterprise workstation GPUs; virtual GPU (vGPU) software; automotive infotainment platforms; and Omniverse Enterprise software)."
    company: NVDA
    type: factual
    expected_route: TEXT
    relevant: "NVDA FY2025 business"

  - question: "What does Apple say about competition in its markets?"
    ground_truth: "Apple's markets are highly competitive, characterized by aggressive price competition and downward pressure on gross margins, frequent new-product introductions, short product life cycles, evolving industry standards, rapid technological change, and price sensitivity. Many competitors compete through aggressive pricing and very low cost structures and by imitating Apple's products and infringing its IP; some provide products at little or no profit. Principal competitive factors include price, product/service features (incl. security), relative price and performance, quality and reliability, design innovation, a strong third-party ecosystem, marketing and distribution, service and support, and reputation. Apple holds a minority market share in the global smartphone, personal computer, and tablet markets, and its services also face substantial competition (including free-content business models)."
    company: AAPL
    type: factual
    expected_route: TEXT
    relevant: "AAPL FY2024 business"

  - question: "What risks does NVIDIA disclose related to export controls on sales to China?"
    ground_truth: "NVIDIA discloses that it has been subject to shifting and expanding U.S. export controls affecting sales to China. Beginning in fiscal 2023 the U.S. government imposed licensing requirements on exports to China (and Russia) of its A100 and H100 GPUs and systems; in October 2023 it expanded and updated the requirements (effective Q4 FY2024) to cover more products (e.g., A100, A800, H100, H800, L4, L40, L40S, RTX 4090) and additional country groups including China and Country Groups D1/D4/D5; and on January 15, 2025 the 'AI Diffusion' interim final rule introduced a worldwide licensing requirement on covered products (including future ICs and systems such as DGX/HGX/MGX and Blackwell). NVIDIA states it has not received licenses to ship the restricted products to China, that its competitive position has been harmed, and that further changes could effectively exclude it from all or part of the China market."
    company: NVDA
    type: factual
    expected_route: TEXT
    relevant: "NVDA FY2025 risk_factors"

  - question: "How does Microsoft describe the role of AI across its products?"
    ground_truth: "Microsoft describes AI as fundamentally transforming productivity for every individual, organization, and industry, with AI offerings spanning every layer of its technology stack and a commitment to deploying AI responsibly with safety and security. AI is embedded across products: Microsoft 365 Copilot and the Copilot stack for productivity; Azure AI (supercomputing at scale, Azure AI Foundry/Studio, custom silicon such as Azure Maia/Cobalt, and the OpenAI partnership) in Intelligent Cloud; GitHub Copilot for developers; Copilot for Security; Nuance healthcare/ambient AI; Dynamics 365 agentic AI; and Copilot in Windows, the Edge browser, and the Bing search engine."
    company: MSFT
    type: factual
    expected_route: TEXT
    relevant: "MSFT FY2024 business"

  - question: "What does Apple disclose about its supply chain concentration risk?"
    ground_truth: "Apple obtains certain critical components from single or limited sources, and new products often use custom components available from only one source, exposing it to significant supply and pricing risk — including industry-wide shortages and commodity price fluctuations (e.g., the global semiconductor industry). Substantially all manufacturing and assembly is concentrated with a small number of outsourcing partners located primarily in China mainland, India, Japan, South Korea, Taiwan and Vietnam, often in single locations. Because it relies on single or limited sources for the supply and manufacture of many critical components, a business interruption affecting those sources would exacerbate the negative consequences to the Company."
    company: AAPL
    type: factual
    expected_route: TEXT
    relevant: "AAPL FY2024 risk_factors"

