  # ============ F. SECTION-SPECIFIC CITATION (3) — TEXT ============
  - question: "According to Item 7A, what market risks is Apple exposed to?"
    ground_truth: "In Item 7A, Apple discloses two market risks: (1) Interest rate risk — U.S. interest-rate fluctuations affect the fair value of its investment portfolio and the interest expense on its term debt (a hypothetical 100 bps increase would cut investment-portfolio fair value by about $2,416 million and raise annual term-debt interest expense by about $129 million as of FY2025); and (2) Foreign exchange rate risk — as a net receiver of non-U.S. currencies, a strengthening U.S. dollar negatively affects net sales and gross margins, with a value-at-risk model estimating a maximum one-day loss of about $590 million on its foreign-currency derivative positions. Apple may use derivative instruments to manage both."
    company: AAPL
    type: citation
    expected_route: TEXT
    relevant: "AAPL FY2025 market_risk"

  - question: "What does Microsoft disclose about legal proceedings?"
    ground_truth: "Microsoft discloses that it is subject to a variety of claims, lawsuits, and regulatory proceedings arising in the ordinary course of business. A specific matter it highlights is the Irish Data Protection Commission (IDPC) investigation of LinkedIn over whether its targeted-advertising practices violated the EU GDPR; in October 2024 the IDPC issued a final decision alleging GDPR violations and assessing a fine, which LinkedIn appealed in November 2024 (next hearing scheduled December 2025). As of June 30, 2025, Microsoft had accrued aggregate legal liabilities of $541 million and disclosed that reasonably possible losses beyond recorded amounts could reach approximately $600 million."
    company: MSFT
    type: citation
    expected_route: TEXT
    relevant: "MSFT FY2025 financial_statements"

  - question: "What critical audit matters did NVIDIA's auditors highlight in the most recent filing?"
    ground_truth: "NVIDIA's independent auditor, PricewaterhouseCoopers LLP, highlighted one critical audit matter: the Valuation of Inventories — specifically the provisions for excess or obsolete inventories and excess product purchase commitments. It was deemed critical because of the significant management judgment involved in estimating future demand and market conditions (including the impact of regulatory export restrictions). As of January 25, 2026, NVIDIA's inventory balance was $21.4 billion and its outstanding inventory purchase and long-term supply and capacity obligations were $95.2 billion."
    company: NVDA
    type: citation
    expected_route: TEXT
    relevant: "NVDA FY2026 financial_statements"

