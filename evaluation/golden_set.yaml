  # ============ F. SECTION-SPECIFIC CITATION CHECKS (3) — citation accuracy ============
  - question: "According to Item 7A, what market risks is Amazon exposed to?"
    ground_truth: "Item 7A discloses three market risks: (1) Interest rate risk — affecting its investment portfolio of marketable debt securities and money-market funds, and the fair value of its fixed-rate long-term debt; (2) Foreign exchange risk — from its internationally-focused stores and AWS (primarily Euros, British Pounds, and Japanese Yen) and from foreign-denominated cash and intercompany balances; and (3) Equity investment risk — market-price volatility on its equity, equity-warrant, and convertible-debt investments in public and private companies (e.g., Rivian and Anthropic)."
    company: AMZN
    type: citation
    expected_route: TEXT
    relevant: "AMZN FY2025 market_risk"

  - question: "What does Alphabet disclose about legal proceedings?"
    ground_truth: "Alphabet discloses extensive legal proceedings, dominated by antitrust matters in the US, EU, and elsewhere — including the EC Shopping (€2.4B), Android (€4.1B), and AdSense (€1.5B, later annulled) fines; the US DOJ Search case (ruled against Google, with distribution restrictions and data-sharing remedies entered December 2025, under appeal); advertising-technology cases (a US DOJ ruling on publisher tools and a €3.0B EC self-preferencing fine); and Google Play matters (the Epic Games verdict and a 50-state Attorneys General settlement). It also discloses privacy matters (including a $1.4 billion settlement), patent/IP infringement claims, EU Digital Markets Act investigations, Russia-related matters, and non-income-tax audits. Alphabet says it disputes the open claims and will defend itself vigorously, and that outcomes are inherently unpredictable and could be material."
    company: GOOGL
    type: citation
    expected_route: TEXT
    relevant: "GOOGL FY2025 financial_statements"

  - question: "What critical audit matters did Amazon's auditors highlight in the most recent filing?"
    ground_truth: "One critical audit matter: Uncertain Tax Positions. Amazon is subject to income taxes in the U.S. and numerous foreign jurisdictions where the ultimate determination of many tax positions is uncertain, requiring significant judgment to assess whether a position is more likely than not to be sustained and to measure the recognized benefit. As of December 31, 2025, Amazon reported $6.6 billion of accrued liabilities for tax contingencies. Auditing this was especially challenging and subjective, so the auditors tested related controls and involved tax specialists."
    company: AMZN
    type: citation
    expected_route: TEXT
    relevant: "AMZN FY2025 financial_statements"

