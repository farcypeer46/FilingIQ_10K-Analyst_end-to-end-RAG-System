  - question: "How did Amazon's risk factor discussion of AI change between its 2023 and 2025 filings?"
    ground_truth: "AI became far more pervasive in the risk factors. In 2023, AI appeared in a handful of places: intensifying competition (AI/ML applications), intellectual-property infringement (its and customers' use of AI), ethical/social perceptions of its AI development, reliance on limited semiconductor/GPU suppliers for AI infrastructure, and evolving AI regulation. By 2025, AI was woven into many more risks — added to the 'internet and other technologies including artificial intelligence facilitate competitive entry' language; explicitly named as an investment risk of expanding into new products/technologies; cited as a strain on management from adopting AI/ML; listed as a data-security threat vector ('developing technologies such as artificial intelligence'); and added to competition for technical talent. The wording also broadened from AI 'use' to 'development and use' and added 'automation.' Overall AI shifted from a few specific mentions to a cross-cutting theme."
    company: AMZN
    type: comparison
    expected_route: TEXT
    relevant: "AMZN FY2023 risk_factors; AMZN FY2025 risk_factors"

