  - question: "What risks related to AI do Amazon and Alphabet each disclose in their most recent 10-Ks, and how do they differ?"
    ground_truth: "Both disclose AI risks but with different emphasis. Alphabet: AI is highly competitive and rapidly evolving, requires heavy investment (infrastructure, custom TPUs); competitors may build superior or cheaper AI; AI is reshaping advertising in ways it may not adapt to; specialized AI-chip (GPU/TPU) supply is constrained; and AI raises ethical, legal, and regulatory challenges. Amazon: AI facilitates competitive entry and comparison shopping; its AI/ML investments may not recoup their cost; its and its customers' use of AI may increase intellectual-property infringement claims; and it relies on a limited group of suppliers for AI-related semiconductors such as GPUs. In short, Alphabet frames AI around its core search/ads and cloud plus chip supply, while Amazon frames it around competition, investment payoff, IP, and component supply."
    company: BOTH
    type: cross_company
    expected_route: TEXT
    relevant: "GOOGL FY2025 risk_factors; AMZN FY2025 risk_factors"
