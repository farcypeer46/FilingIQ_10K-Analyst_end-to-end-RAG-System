# Held-out golden Q&A set — AMZN and GOOGL ONLY (never the dev companies AAPL/MSFT/NVDA).
#
# HOW TO FILL THIS IN:
#   - ground_truth: ""      -> ANSWERABLE, still TO FILL (needs filing text).
#   - ground_truth: REFUSE  -> the system MUST refuse (do not add an answer).
#   - relevant: ""          -> write the source chunk "COMPANY FYyyyy section" for Hit@k/MRR.
#
# `type` drives per-category metrics:
#   factual | numeric | comparison | refuse | adversarial | citation | cross_company
#
# All numeric/comparison ground_truths below were VERIFIED against the income
# statements / segment tables in the index (USD millions).

questions:

  # ============ A. SIMPLE FACTUAL (10) — basic retrieval + citation ============
  - question: "What are Amazon's reportable business segments?"
    ground_truth: "North America, International, and Amazon Web Services (AWS)."
    company: AMZN
    type: factual
    expected_route: TEXT
    relevant: "AMZN FY2025 business"

  - question: "What does Amazon identify as its main sources of competition?"
    ground_truth: "A broad array of competitors across sectors: physical, e-commerce, and omnichannel retailers; media producers and distributors; web search engines, comparison-shopping sites, and social networks; e-commerce service providers; fulfillment and logistics companies; IT and cloud providers (including AI); consumer-electronics makers; online and physical grocers; advertising-services firms; and healthcare providers. Principal competitive factors in retail are selection, price, and convenience."
    company: AMZN
    type: factual
    expected_route: TEXT
    relevant: "AMZN FY2025 business"

  - question: "What risks does Amazon cite related to international operations?"
    ground_truth: "Local economic and political conditions; government regulation and restrictive/trade-protection actions (tariffs, foreign-ownership limits); IP-enforcement and product-distribution restrictions; licensing requirements; limits on fund repatriation and foreign-exchange restrictions; limited local infrastructure; unfavorable payment cycles; privacy/data/consumer-protection laws; lower internet use and consumer spending; higher payment risk; staffing and management difficulty; labor unions/works councils; FCPA compliance; trade and tax policy; and geopolitical events. PRC and India impose specific foreign-ownership and licensing restrictions, and heavy reliance on China-based sellers and suppliers adds trade/regulatory risk."
    company: AMZN
    type: factual
    expected_route: TEXT
    relevant: "AMZN FY2025 risk_factors"

  - question: "How does Alphabet describe its \"Other Bets\" segment?"
    ground_truth: "Other Bets is Alphabet's collection of all non-Google businesses, at various stages of development — from R&D-phase ventures like X (the moonshot factory) to commercializing ones like Waymo (autonomous ride-hailing) and Isomorphic Labs (AI drug discovery). They operate as independent companies, some with their own boards and outside investors, and generate revenue primarily from the sale of autonomous transportation and internet services."
    company: GOOGL
    type: factual
    expected_route: TEXT
    relevant: "GOOGL FY2025 business"

  - question: "What are Alphabet's main revenue sources within Google Services?"
    ground_truth: "Google Services earns revenue primarily from advertising — performance and brand ads on Google Search & other properties, YouTube, and Google Network partners' properties. It also earns non-advertising revenue from consumer subscriptions (e.g., YouTube TV, YouTube Music and Premium, NFL Sunday Ticket, Google One), platforms (Google Play app sales and in-app purchases), and devices (the Pixel family)."
    company: GOOGL
    type: factual
    expected_route: TEXT
    relevant: "GOOGL FY2025 business"

  - question: "What does Amazon say about the seasonality of its sales?"
    ground_truth: "Its business is seasonal, historically generating higher sales volume in the fourth quarter, which ends December 31 (the holiday season)."
    company: AMZN
    type: factual
    expected_route: TEXT
    relevant: "AMZN FY2025 business"

  - question: "What risks does Alphabet identify related to regulation and antitrust?"
    ground_truth: "Alphabet faces heightened US and foreign government scrutiny and numerous evolving laws and regulations — particularly on AI, competition/antitrust, consumer protection, content moderation (including access for minors), data privacy and security, intellectual property, and news publications. Compliance may be onerous and could increase its cost of doing business, make products less useful, limit or force changes to its business practices and offerings, affect its competitive position, and harm its business, reputation, and results."
    company: GOOGL
    type: factual
    expected_route: TEXT
    relevant: "GOOGL FY2025 risk_factors"

  - question: "Where are Amazon's principal properties and fulfillment operations located?"
    ground_truth: "As of December 31, 2025, Amazon's facilities span North America and International. The large majority of its square footage is fulfillment, data centers, and other operations (about 474 million leased sq ft in North America and 186 million internationally), alongside office space and physical stores — roughly 741.5 million leased and 78.1 million owned square feet in total."
    company: AMZN
    type: factual
    expected_route: TEXT
    relevant: "AMZN FY2025 risk_factors"   # Item 2 Properties is mislabeled risk_factors in the index

  - question: "What does Alphabet say about its dependence on advertising revenue as a risk?"
    ground_truth: "Alphabet generates a significant portion of revenue from advertising — more than 70% of total revenues in 2025. Reduced advertiser spending, loss of partners (who can terminate at any time), shifts in online advertising or new ad formats, adverse macroeconomic conditions, or technologies that block or impair personalized ads could harm its business, financial condition, and operating results."
    company: GOOGL
    type: factual
    expected_route: TEXT
    relevant: "GOOGL FY2025 risk_factors"

  - question: "How does Amazon describe the role of AWS in its business?"
    ground_truth: "AWS is one of Amazon's three reportable segments; it serves developers and enterprises of all sizes with a broad set of on-demand technology services, including compute, storage, database, analytics, and artificial intelligence and machine learning."
